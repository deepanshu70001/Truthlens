name: TruthLens Experiment 3 — Multivariate Forensic Screening

on:
  push:
    branches:
      - research/experiment3-multivariate-screening
    paths:
      - "experiments/run_experiment3_multivariate_screening.py"
      - "experiments/test_experiment3_multivariate_screening.py"
      - "research/experiment3_multivariate_screening/protocol.md"
      - ".github/workflows/experiment3.yml"

permissions:
  contents: write

jobs:
  experiment3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 pytest==8.3.5

      - name: Run Experiment 3 unit tests
        run: python -m pytest experiments/test_experiment3_multivariate_screening.py -q

      - name: Execute Experiment 3
        run: python experiments/run_experiment3_multivariate_screening.py

      - name: Upload reproducibility package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthlens-experiment3-multivariate-screening
          path: research/experiment3_multivariate_screening/
          if-no-files-found: error
          retention-days: 30

      - name: Commit experiment outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/experiment3_multivariate_screening
          if ! git diff --cached --quiet; then
            git commit -m "research: record experiment 3 multivariate screening results"
            git push origin HEAD:research/experiment3-multivariate-screening
          fi
