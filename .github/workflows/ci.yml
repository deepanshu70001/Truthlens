name: TruthLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Backend: compile-check and deterministic tests ─────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-dev.txt

      - name: Python compile check (backend application and migrations)
        run: python -m compileall -q backend/app backend/migrations

      - name: Run backend tests without protected research artifacts
        run: >-
          python -m pytest backend/tests -q -rs
          --ignore-glob='backend/tests/test_phase*.py'
          --ignore=backend/tests/test_authenticity_calibration.py
          --ignore=backend/tests/integration
        env:
          APP_ENV: test
          APP_DEBUG: "true"
          DEV_AUTH_BYPASS: "true"
          TRUTHLENS_REAL_MODEL_TESTS: "0"

  # ── Frontend: build and lint ───────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test -- --reporter=dot

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser workflow test
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

  # ── Repo hygiene ───────────────────────────────────────────────
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace check
        env:
          BASE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
