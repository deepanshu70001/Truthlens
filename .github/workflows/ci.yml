name: TruthLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Backend: compile-check and deterministic tests ─────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Python compile check (backend + experiments)
        run: python -m compileall -q backend/app experiments

      - name: Run deterministic backend tests
        run: python -m pytest backend/tests -q -rs --ignore=backend/tests/integration
        env:
          APP_ENV: test
          APP_DEBUG: "true"
          # Real model / provider tests stay optional
          # Set TRUTHLENS_REAL_MODEL_TESTS=1 in repo secrets to enable
          TRUTHLENS_REAL_MODEL_TESTS: ${{ vars.TRUTHLENS_REAL_MODEL_TESTS || '0' }}

  # ── Frontend: build and lint ───────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Lint
        run: npm run lint

  # ── Repo hygiene ───────────────────────────────────────────────
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Whitespace check
        run: git diff --check HEAD~1 || true
